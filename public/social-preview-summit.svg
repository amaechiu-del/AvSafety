<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B1A"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#050B1A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#D4AF37" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Header Crown & Brand -->
  <g transform="translate(80, 70)">
    <path d="M 0 30 L 15 0 L 30 20 L 45 0 L 60 30 Z" fill="url(#goldGrad)" />
    <text x="80" y="24" font-family="'Cinzel', serif, Georgia" font-size="22" font-weight="bold" fill="#D4AF37" letter-spacing="4">
      DOMISLINK • THE DIGITAL EMPIRE
    </text>
  </g>

  <!-- Event Title -->
  <text x="80" y="190" font-family="'Cinzel', serif, Georgia" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="2">
    AVIATION SAFETY SUMMIT 2026
  </text>

  <!-- Theme Box -->
  <rect x="80" y="235" width="1040" height="130" rx="14" fill="#0D2140" stroke="#D4AF37" stroke-width="2" stroke-opacity="0.8"/>
  <text x="110" y="275" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FFD700" letter-spacing="3">
    OFFICIAL SUMMIT THEME
  </text>
  <text x="110" y="325" font-family="'Cinzel', serif, Georgia" font-size="34" font-weight="bold" fill="#FFFFFF" letter-spacing="1.5">
    "EVERYBODY IS INVOLVED IN AVIATION SAFETY"
  </text>

  <!-- Coordinates & Date -->
  <g transform="translate(80, 420)">
    <!-- Date Box -->
    <rect x="0" y="0" width="320" height="90" rx="10" fill="white" fill-opacity="0.05" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="24" y="34" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#D4AF37" letter-spacing="2">DATE</text>
    <text x="24" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">17 NOVEMBER 2026</text>

    <!-- Venue Box -->
    <rect x="340" y="0" width="460" height="90" rx="10" fill="white" fill-opacity="0.05" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="364" y="34" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#D4AF37" letter-spacing="2">VENUE</text>
    <text x="364" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Marriott Hotel, Ikeja, Lagos, Nigeria</text>

    <!-- Web Link Box -->
    <rect x="820" y="0" width="220" height="90" rx="10" fill="url(#goldGrad)"/>
    <text x="844" y="38" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0A192F" letter-spacing="1">EXPLORE PORTAL</text>
    <text x="844" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#0A192F">summit.domislink.com</text>
  </g>

  <!-- Footer Tagline -->
  <text x="80" y="560" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#8A99AD">
    Convened by Amaechi Ubadike • Unifying Commercial Airlines, Regulators, Energy, Banking, Flight Sim &amp; 33+ Sectors
  </text>
</svg>
