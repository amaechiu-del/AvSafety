name: Performance Regression Detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  performance-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Capture build metrics
        run: |
          node -e "const fs=require('fs'); const path='dist'; let size=0; const walk=(d)=>{for(const f of fs.readdirSync(d)){const p=d+'/'+f; const s=fs.statSync(p); if(s.isDirectory()) walk(p); else size+=s.size;}}; if(fs.existsSync(path)) walk(path); fs.writeFileSync('performance-report.json', JSON.stringify({timestamp:new Date().toISOString(), distSizeBytes:size}, null, 2)); console.log('dist size bytes', size);"

      - name: Enforce dist size budget
        run: |
          node -e "const report=require('./performance-report.json'); const limit=25*1024*1024; if(report.distSizeBytes>limit){console.error('Performance regression: dist exceeds 25MB budget'); process.exit(1);}"

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.json
