    <script>
      // Initialize React Fast Refresh preamble synchronously so Vite React plugin never throws preamble detection error
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script>
      // Suppress benign [vite] websocket connection messages in sandboxed preview environments
      (function() {
        try {
          const OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            function isViteSocket(url, protocols) {
              const u = String(url || '').toLowerCase();
              const p = String(protocols || '').toLowerCase();
              return (
                p.includes('vite-hmr') ||
                p.includes('vite-ping') ||
                u.includes('vite-hmr') ||
                u.includes(':24678') ||
                (u.includes('token=') && (u.includes('24678') || u.includes('5173') || u.includes('vite')))
              );
            }

            class SilentViteSocket extends EventTarget {
              constructor(url, protocols) {
                super();
                this.url = url;
                this.protocol = Array.isArray(protocols) ? protocols[0] || '' : (protocols || '');
                this.CONNECTING = 0;
                this.OPEN = 1;
                this.CLOSING = 2;
                this.CLOSED = 3;
                this.readyState = 1; // WebSocket.OPEN
                this.binaryType = 'blob';
                this.bufferedAmount = 0;
                this.extensions = '';
                this.onopen = null;
                this.onmessage = null;
                this.onerror = null;
                this.onclose = null;

                setTimeout(() => {
                  try {
                    const openEvt = new Event('open');
                    this.dispatchEvent(openEvt);
                    if (typeof this.onopen === 'function') this.onopen(openEvt);

                    const msgEvt = new MessageEvent('message', {
                      data: JSON.stringify({ type: 'connected' })
                    });
                    this.dispatchEvent(msgEvt);
                    if (typeof this.onmessage === 'function') this.onmessage(msgEvt);
                  } catch (e) {}
                }, 0);
              }

              send(data) {
                try {
                  const parsed = typeof data === 'string' ? JSON.parse(data) : data;
                  if (parsed && parsed.type === 'ping') {
                    setTimeout(() => {
                      try {
                        const pongEvt = new MessageEvent('message', {
                          data: JSON.stringify({ type: 'pong' })
                        });
                        this.dispatchEvent(pongEvt);
                        if (typeof this.onmessage === 'function') this.onmessage(pongEvt);
                      } catch (e) {}
                    }, 0);
                  }
                } catch (e) {}
              }

              close(code = 1000, reason = '') {
                this.readyState = 3;
                try {
                  const evt = new CloseEvent('close', { code, reason, wasClean: true });
                  this.dispatchEvent(evt);
                  if (typeof this.onclose === 'function') this.onclose(evt);
                } catch (e) {}
              }
            }

            SilentViteSocket.prototype.CONNECTING = 0;
            SilentViteSocket.prototype.OPEN = 1;
            SilentViteSocket.prototype.CLOSING = 2;
            SilentViteSocket.prototype.CLOSED = 3;
            SilentViteSocket.CONNECTING = 0;
            SilentViteSocket.OPEN = 1;
            SilentViteSocket.CLOSING = 2;
            SilentViteSocket.CLOSED = 3;

            window.WebSocket = function(url, protocols) {
              if (isViteSocket(url, protocols)) {
                return new SilentViteSocket(url, protocols);
              }
              return new OriginalWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OriginalWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }

          function shouldSuppress(args) {
            if (!args || !args.length) return false;
            try {
              for (let i = 0; i < args.length; i++) {
                const item = args[i];
                if (!item) continue;
                const str = typeof item === 'string' ? item : (item.message || item.stack || (typeof item.toString === 'function' ? item.toString() : ''));
                if (
                  str.includes('[vite] failed to connect to websocket') ||
                  str.includes('[vite] connecting...') ||
                  str.includes('[vite] connected.') ||
                  str.includes('[vite] Direct websocket connection fallback') ||
                  str.includes('[vite] server connection lost') ||
                  str.includes('WebSocket closed without opened.') ||
                  (str.includes('failed to connect to websocket') && (str.includes('vite') || str.includes('24678')))
                ) {
                  return true;
                }
              }
            } catch (e) {}
            return false;
          }

          const methods = ['error', 'warn', 'log', 'info', 'debug'];
          methods.forEach(function(m) {
            const orig = console[m];
            if (typeof orig === 'function') {
              console[m] = function(...args) {
                if (shouldSuppress(args)) return;
                orig.apply(console, args);
              };
            }
          });

          window.addEventListener('error', function(e) {
            if (e && (shouldSuppress([e.message]) || (e.filename && (e.filename.includes('client.mjs') || e.filename.includes('@vite'))))) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (e && shouldSuppress([e.reason, e.reason && e.reason.message])) {
              e.stopImmediatePropagation();
              e.preventDefault();
            }
          }, true);
        } catch (err) {}
      })();
    </script>
