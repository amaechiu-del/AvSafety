    <script>
      // Initialize React Fast Refresh preamble synchronously so Vite React plugin never throws preamble detection error
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
      window.__vite_plugin_react_preamble_installed__ = true;
    </script>
    <script>
      // Suppress benign [vite] websocket connection messages in sandboxed preview environments
      (function() {
        function shouldSuppress(args) {
          for (let i = 0; i < args.length; i++) {
            const item = args[i];
            if (typeof item === 'string' && (item.includes('[vite]') || item.includes('websocket') || item.includes('WebSocket') || item.includes('preamble'))) return true;
            if (item && typeof item.message === 'string' && (item.message.includes('[vite]') || item.message.includes('websocket') || item.message.includes('WebSocket') || item.message.includes('preamble'))) return true;
          }
          return false;
        }
        const _error = console.error;
        console.error = function(...args) {
          if (shouldSuppress(args)) return;
          _error.apply(console, args);
        };
        const _warn = console.warn;
        console.warn = function(...args) {
          if (shouldSuppress(args)) return;
          _warn.apply(console, args);
        };
        const _log = console.log;
        console.log = function(...args) {
          if (shouldSuppress(args)) return;
          _log.apply(console, args);
        };
        const _info = console.info;
        console.info = function(...args) {
          if (shouldSuppress(args)) return;
          _info.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (e && (shouldSuppress([e.message]) || (e.filename && e.filename.includes('client.mjs')))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && shouldSuppress([e.reason, e.reason && e.reason.message])) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
